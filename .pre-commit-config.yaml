# One-time setup: `pre-commit install`. On every commit this builds each notebook's static .ipynb in outputs/ from
# its latest saved run and stages it (scripts/build_ipynb.py), so it joins the commit. A run that is incomplete, failed or stale blocks the commit.
repos:
  - repo: local
    hooks:
      - id: build-ipynb
        name: build static .ipynb from saved runs
        entry: python scripts/build_ipynb.py
        language: system
        pass_filenames: false
        always_run: true  # __marimo__/ is git-ignored, so a fresh save never shows up as a staged file
